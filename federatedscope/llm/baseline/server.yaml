use_gpu: True
early_stop:
  patience: 0
federate:
  mode: distributed
  client_num: 4
  total_round_num: 250
  save_to: "gpt2_new.ckpt"
data:
  root: data/
  type: 'rosetta_alpaca@llm'
  splits: [0.85,0.1,0.05]
  splitter: 'iid'
distribute:
  use: True
  server_host: '10.214.151.191'
  server_port: 50051
  role: 'server'
  data_idx: 0
  grpc_max_send_message_length: 1048576000
  grpc_max_receive_message_length: 1048576000
llm:
  tok_len: 1000
  chat:
    max_len: 1000
  adapter:
    use: True
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 32, 'lora_dropout': 0.1 } ]
  deepspeed:
    use: False
    ds_config: 'federatedscope/llm/baseline/deepspeed/ds_config.json'
  offsite_tuning:
    use: False
    emu_l: 2
    emu_r: 30
dataloader:
  batch_size: 2
model:
  type: 'gpt2@huggingface_llm'
train:
  local_update_steps: 25
  batch_or_epoch: batch
  optimizer:
    lr: 0.001
    weight_decay: 0.0
criterion:
  type: CrossEntropyLoss
trainer:
  type: llmtrainer
eval:
  freq: 2
  metrics: ['loss']
  count_flops: False