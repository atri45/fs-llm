use_gpu: True
early_stop:
  patience: 3
federate:
  method: fedspeed
  aggregation_mode: 'local-reconstruct'
  asynchronous_aggregation: True
  anonymous_routing: False
  use_activation_checkpointing: True
  use_offline_model: True
  mode: distributed
  client_num: 4
  save_to: "gpt2_alpaca.ckpt"
data:
  root: data/
  type: 'alpaca@llm'
  splits: [0.98,0.01,0.01]
  splitter: 'iid'
distribute:
  use: True
  server_host: '127.0.0.1'
  server_port: 50051
  role: 'server'
  data_idx: -1
  grpc_max_send_message_length: 1048576000
  grpc_max_receive_message_length: 1048576000
llm:
  tok_len: 1000
  chat:
    max_len: 1000
  adapter:
    use: True
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 32, 'lora_dropout': 0.1 } ]
  deepspeed:
    use: False
    ds_config: 'federatedscope/llm/baseline/deepspeed/ds_config.json'
  offsite_tuning:
    use: False
    emu_l: 2
    emu_r: 30
dataloader:
  batch_size: 2
model:
  type: 'gpt2@huggingface_llm'
train:
  local_update_steps: 5000
  batch_or_epoch: batch
  optimizer:
    lr: 0.001
    weight_decay: 0.0
criterion:
  type: CrossEntropyLoss
trainer:
  type: fedspeedtrainer
eval:
  freq: 100
  metrics: ['loss']
  count_flops: False