use_gpu: True
device: 0
early_stop:
  patience: 3
federate:
  method: fedspeed
  aggregation_mode: 'shardedGradient'
  aggregation_steps: 1
  asynchronous_aggregation: True
  anonymous_routing: True
  use_activation_checkpointing: True
  mode: distributed
  client_num: 4
  save_to: "./saved_models/gpt2_alpaca.ckpt"
  model_cache_path: './model_cache/'
  use_offline_model: True
  gpu_mem_pressure_threshold: 0.8
  cpu_mem_pressure_threshold: 0.8
  prefetch_depth: 12
  transformer_block_class_name: 'GPT2Block'
  two_stages: 
    use: False
    stage_one_steps: 600
    noniid: False
    group_num: 2
  adaptive_weight:
    use: True
    type: 'exponential'
    decay_rate: 0.95
  gossip_num: -1
data:
  root: data/
  type: 'gsm8k@llm'
  splits: [0.9,0.1,0]
  splitter: 'iid'
  splitter_args: [ 
    {
      num_groups: 2,
      base_splitter_type: 'lda',
      alpha: 0.1
    }
  ]
distribute:
  use: True
  server_host: '10.214.151.191'
  server_port: 50051
  client_host: '10.214.151.191'
  client_port: 50053
  role: 'client'
  data_idx: 2
  grpc_max_send_message_length: 1048576000
  grpc_max_receive_message_length: 1048576000
llm:
  tok_len: 1000
  chat:
    max_len: 1000
  adapter:
    use: True
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 32, 'lora_dropout': 0.1 } ]
  deepspeed:
    use: False
    ds_config: 'federatedscope/llm/baseline/deepspeed/ds_config.json'
  offsite_tuning:
    use: False
    emu_l: 2
    emu_r: 30
dataloader:
  batch_size: 2
model:
  type: 'gpt2@huggingface_llm'
train:
  local_update_steps: 5000
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    lr: 0.0003
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1e-8
criterion:
  type: CrossEntropyLoss
trainer:
  type: fedspeedtrainer
eval:
  freq: 50
  metrics: ['loss']
  count_flops: False