use_gpu: True
early_stop:
  patience: 0
federate:
  method: fedspeed
  aggregation_mode: 'model'
  aggregation_steps: 10
  use_activation_checkpointing: True
  mode: distributed
  client_num: 2
  total_round_num: 1
  save_to: "gpt2_alpaca.ckpt"
data:
  root: data/
  type: 'alpaca@llm'
  splits: [0.98,0.01,0.01]
  splitter: 'iid'
distribute:
  use: True
  server_host: '127.0.0.1'
  server_port: 50051
  client_host: '127.0.0.1'
  client_port: 50053
  role: 'client'
  data_idx: 2
  grpc_max_send_message_length: 1048576000
  grpc_max_receive_message_length: 1048576000
llm:
  tok_len: 1000
  chat:
    max_len: 1000
  adapter:
    use: True
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 32, 'lora_dropout': 0.1 } ]
  deepspeed:
    use: False
    ds_config: 'federatedscope/llm/baseline/deepspeed/ds_config.json'
  offsite_tuning:
    use: False
    emu_l: 2
    emu_r: 30
dataloader:
  batch_size: 2
model:
  type: 'gpt2@huggingface_llm'
train:
  local_update_steps: 500
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    lr: 0.0003
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1e-8
criterion:
  type: CrossEntropyLoss
trainer:
  type: fedspeedtrainer
eval:
  freq: 10
  metrics: ['loss']
  count_flops: False