use_gpu: True
device: 0
early_stop:
  patience: 10
federate:
  mode: standalone
  client_num: 1
  total_round_num: 100
  save_to: "gpt2.offsite_align.ckpt"
  share_local_model: True
  online_aggr: False
data:
  root: data/
  type: 'alpaca@llm'
  splits: [0.98,0.01,0.01]
  splitter: 'iid'
llm:
  tok_len: 1000
  chat:
    max_len: 1000
  adapter:
    use: True
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 32, 'lora_dropout': 0.1 } ]
  deepspeed:
    use: True
    ds_config: 'federatedscope/llm/baseline/deepspeed/ds_config.json'
  offsite_tuning:
    use: True
    emu_l: 2
    emu_r: 30
    emu_align:
      use: True
      restore_from: 'aligned_emulator.ckpt'
      save_to: 'aligned_emulator.ckpt'
      train:
        local_update_steps: 10
        batch_or_epoch: 'batch'
        lm_loss_weight: 0.1
        kd_loss_weight: 0.9
        optimizer:
          lr: 0.01
dataloader:
  batch_size: 4
model:
  type: 'gpt2@huggingface_llm'
train:
  local_update_steps: 10
  batch_or_epoch: batch
  optimizer:
    lr: 0.001
    weight_decay: 0.0
#  is_enable_half: True
criterion:
  type: CrossEntropyLoss
trainer:
  type: llmtrainer
eval:
  freq: 10
  metrics: ['loss']
  best_res_update_round_wise_key: 'val_loss'