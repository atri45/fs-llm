use_gpu: True
device: 0
early_stop:
  patience: 3
federate:
  method: fedspeed
  aggregation_mode: 'local-reconstruct'
  aggregation_steps: 40
  asynchronous_aggregation: True
  anonymous_routing: False
  use_activation_checkpointing: True
  mode: distributed
  client_num: 4
  save_to: "gpt2_alpaca.ckpt"
  model_cache_path: './model_cache/'
  use_offline_model: True
  gpu_mem_pressure_threshold: 0.8
  cpu_mem_pressure_threshold: 0.8
  prefetch_depth: 12
  transformer_block_class_name: 'GPT2Block'
  two_stage_training: False
  stage_one_steps: 800
  adaptive_weight:
    use: True
    type: 'exponential'
    decay_rate: 0.9
  gossip_num: 2
data:
  root: data/
  type: 'alpaca@llm'
  splits: [0.98,0.01,0.01]
  splitter: 'iid'
distribute:
  use: True
  server_host: '127.0.0.1'
  server_port: 50051
  client_host: '127.0.0.1'
  client_port: 50055
  role: 'client'
  data_idx: 4
  grpc_max_send_message_length: 1048576000
  grpc_max_receive_message_length: 1048576000
llm:
  tok_len: 1000
  chat:
    max_len: 1000
  adapter:
    use: True
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 32, 'lora_dropout': 0.1 } ]
  deepspeed:
    use: False
    ds_config: 'federatedscope/llm/baseline/deepspeed/ds_config.json'
  offsite_tuning:
    use: False
    emu_l: 2
    emu_r: 30
dataloader:
  batch_size: 2
model:
  type: 'gpt2@huggingface_llm'
train:
  local_update_steps: 5000
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    lr: 0.0003
    weight_decay: 0.0
    betas: [0.9, 0.999]
    eps: 1e-8
criterion:
  type: CrossEntropyLoss
trainer:
  type: fedspeedtrainer
eval:
  freq: 80
  metrics: ['loss']
  count_flops: False